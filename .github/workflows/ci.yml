name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Both jobs only read the checkout; nothing here writes back to the repo.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint

  # The suite drives a real WKWebView, so it only runs on macOS. It fails
  # while #4 (OAuth popup) and #6 (passkey) are open: those specs describe
  # behaviour that is still broken and are meant to gate the fixes.
  regression-suite:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: npm test
