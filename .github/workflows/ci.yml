name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Both jobs only read the checkout; nothing here writes back to the repo.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  # The suite drives a real WKWebView, so it only runs on macOS. Specs for
  # behaviour that is still broken (#4, #6) report as pending and do not fail
  # the job, so this stays green until something actually regresses.
  regression-suite:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - run: swift --version
      - run: npm test

  # The capability patterns decide whether toolbar IPC is allowed at all (#18),
  # which the JS suite cannot see. macOS needs no extra system libraries.
  capabilities:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - run: cargo test --manifest-path src-tauri/Cargo.toml --test capabilities
